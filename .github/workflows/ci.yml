name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  quality-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify env templates
        run: pnpm verify:env-templates

      - name: Secret scan
        run: pnpm secrets:scan

      - name: Build monorepo
        run: pnpm build
