name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate successful main release
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - name: Record CI commit
        id: release
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          test "$HEAD_BRANCH" = "main"
          test "$HEAD_SHA" != ""
          echo "release_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying CI run $CI_RUN_ID at $HEAD_SHA"

  release-production:
    name: Migrate and deploy production
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ vars.FRONTEND_URL }}
    env:
      DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      NODE_ENV: production
      BACKEND_DEPLOY_HOOK: ${{ secrets.BACKEND_DEPLOY_HOOK }}
      FRONTEND_DEPLOY_HOOK: ${{ secrets.FRONTEND_DEPLOY_HOOK }}
      MIGRATION_ALERT_WEBHOOK: ${{ secrets.MIGRATION_ALERT_WEBHOOK }}
      BACKEND_URL: ${{ vars.BACKEND_URL }}
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
    steps:
      - name: Checkout CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply production-safe Prisma migrations
        id: migrate
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}" || { echo "MIGRATION_DATABASE_URL is required"; exit 1; }
          pnpm --filter @synapse/backend db:migrate:deploy

      - name: Notify migration failure
        if: ${{ failure() && steps.migrate.outcome == 'failure' && env.MIGRATION_ALERT_WEBHOOK != '' }}
        continue-on-error: true
        env:
          ALERT_ENVIRONMENT: production
        run: |
          set -euo pipefail
          payload="$(node -e 'process.stdout.write(JSON.stringify({ event: "migration.failed", environment: process.env.ALERT_ENVIRONMENT, releaseSha: process.env.RELEASE_SHA }))')"
          if ! curl --fail --silent --max-time 10 \
              --request POST "$MIGRATION_ALERT_WEBHOOK" \
              --header "Content-Type: application/json" \
              --data "$payload" \
              >/dev/null 2>&1; then
            echo "Migration failure alert could not be delivered" >&2
            exit 1
          fi

      - name: Trigger production backend deployment
        run: |
          set -euo pipefail
          test -n "${BACKEND_DEPLOY_HOOK:-}" || { echo "BACKEND_DEPLOY_HOOK is required"; exit 1; }
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 \
            --request POST "$BACKEND_DEPLOY_HOOK" \
            --header "X-Synapse-Release-SHA: $RELEASE_SHA"

      - name: Wait for production backend readiness
        run: |
          set -euo pipefail
          test -n "${BACKEND_URL:-}" || { echo "BACKEND_URL is required"; exit 1; }

          for attempt in $(seq 1 30); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 "$BACKEND_URL/readyz" || true)"

            if [ "$status" = "200" ]; then
              exit 0
            fi

            echo "Waiting for production readiness (attempt $attempt/30, status $status)"
            sleep 10
          done

          echo "Production backend did not become ready"
          exit 1

      - name: Trigger production frontend deployment
        run: |
          set -euo pipefail
          test -n "${FRONTEND_DEPLOY_HOOK:-}" || { echo "FRONTEND_DEPLOY_HOOK is required"; exit 1; }
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 \
            --request POST "$FRONTEND_DEPLOY_HOOK" \
            --header "X-Synapse-Release-SHA: $RELEASE_SHA"

  smoke-production:
    name: Smoke test production
    needs: [prepare, release-production]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.FRONTEND_URL }}
    env:
      SMOKE_BASE_URL: ${{ vars.BACKEND_URL }}
      SMOKE_FRONTEND_ORIGIN: ${{ vars.FRONTEND_URL }}
    steps:
      - name: Checkout CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run deployment smoke tests
        run: node scripts/smoke/deployment-smoke.mjs