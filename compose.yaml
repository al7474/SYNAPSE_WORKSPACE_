services:
  db:
    image: pgvector/pgvector:pg18
    container_name: synapse-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: synapse
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d synapse"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - synapse_db18_data:/var/lib/postgresql

volumes:
  synapse_db18_data:
